<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZippaBook Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 pb-20">

  <!-- Sarlavha -->
  <header class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold text-indigo-600">📚 ZippaBook</h1>
    <span class="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Toshkent</span>
  </header>

  <!-- E'lon qo'shish formasi -->
  <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-gray-200">
    <h2 class="text-sm font-bold text-gray-700 mb-2">Yangi kitob qo'shish</h2>
    <input id="title" type="text" placeholder="Kitob nomi..." class="w-full p-2 mb-2 text-xs rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
    <input id="author" type="text" placeholder="Muallif..." class="w-full p-2 mb-2 text-xs rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
    <select id="condition" class="w-full p-2 mb-3 text-xs rounded-lg border border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      <option value="A'lo">A'lo</option>
      <option value="Yaxshi" selected>Yaxshi</option>
      <option value="O'rtacha">O'rtacha</option>
    </select>
    <button onclick="addBook()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition duration-200">
      E'lon joylash
    </button>
  </div>

  <!-- Qidiruv -->
  <div class="mb-4">
    <input id="search" oninput="filterBooks()" type="text" placeholder="Kitob nomi yoki muallif..." class="w-full p-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
  </div>

  <!-- Vitrina -->
  <div class="grid grid-cols-2 gap-3" id="book-list">
    <div class="col-span-2 text-center text-xs text-gray-400 py-4">Yuklanmoqda...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://dqyapauxewmjfuamqpwi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_U8lxPa5j0SdHoLGpbSAndw_ODgw8Rcl";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let allBooks = [];

    async function loadBooks() {
      const container = document.getElementById('book-list');
      const { data, error } = await _supabase.from('books').select('*').order('id', { ascending: false });

      if (error) {
        container.innerHTML = '<div class="col-span-2 text-center text-xs text-red-500">Xatolik yuz berdi.</div>';
        return;
      }

      allBooks = data;
      renderBooks(allBooks);
    }

    function renderBooks(books) {
      const container = document.getElementById('book-list');
      if (books.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center text-xs text-gray-400 py-4">Kitoblar topilmadi.</div>';
        return;
      }

      container.innerHTML = books.map(book => `
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
          <div>
            <div class="h-24 bg-indigo-50 rounded-lg mb-2 flex items-center justify-center text-indigo-300 text-xs font-medium">
              📖 Cover
            </div>
            <h3 class="font-semibold text-sm truncate text-gray-800">${book.title}</h3>
            <p class="text-xs text-gray-500 truncate mb-2">${book.author}</p>
          </div>
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-[10px] font-bold text-green-600 bg-green-50 px-1.5 py-0.5 rounded">${book.price || 'Almashtirish'}</span>
              <span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">${book.condition}</span>
            </div>
            ${book.owner_telegram ? `
              <a href="https://t.me/${book.owner_telegram.replace('@', '')}" target="_blank" class="block text-center bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-[11px] font-medium py-1 rounded transition">
                Bog'lanish
              </a>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterBooks() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allBooks.filter(b => 
        b.title.toLowerCase().includes(query) || 
        b.author.toLowerCase().includes(query)
      );
      renderBooks(filtered);
    }

    async function addBook() {
      const title = document.getElementById('title').value.trim();
      const author = document.getElementById('author').value.trim();
      const condition = document.getElementById('condition').value;
      const user = tg?.initDataUnsafe?.user;
      const owner_telegram = user?.username ? `@${user.username}` : '';

      if (!title || !author) {
        alert('Iltimos, kitob nomi va muallifini kiriting!');
        return;
      }

      const { error } = await _supabase.from('books').insert([{
        title,
        author,
        condition,
        owner_telegram
      }]);

      if (error) {
        alert('Xatolik: ' + error.message);
      } else {
        alert('Kitob muvaffaqiyatli qo\'shildi!');
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        loadBooks();
      }
    }

    loadBooks();
  </script>
</body>
</html>
